<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Mesto</title>
    <link rel="stylesheet" href="./src/pages/index.css" />
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img
          src="./src/images/logo.svg"
          alt="Логотип проекта место"
          class="logo header__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <button
            type="button"
            class="profile__image"
            aria-label="Обновить аватар"
          ></button>
          <div class="profile__info">
            <h1 class="profile__title">Жак-Ив Кусто</h1>
            <button class="profile__edit-button" type="button"></button>
            <p class="profile__description">Исследователь океана</p>
          </div>
          <button class="profile__add-button" type="button"></button>
        </section>
        <section class="places page__section">
          <ul class="places__list"></ul>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__copyright">© 2025 Mesto Russia</p>
      </footer>

      <div class="popup popup_type_edit">
        <div class="popup__content">
          <button type="button" class="popup__close"></button>
          <h3 class="popup__title">Редактировать профиль</h3>
          <form class="popup__form" name="edit-profile" novalidate>
            <label class="popup__label">
              <input
                type="text"
                name="user-name"
                id="user-name"
                class="popup__input popup__input_type_name"
                placeholder="Имя"
                aria-describedby="user-name-error"
                required
                minlength="2"
                maxlength="40"
                pattern="^[a-zA-Zа-яА-ЯёЁ\s\-]+$"
                data-error-message="Разрешены только латинские и кириллические буквы, пробелы и дефисы."
              />
              <span class="popup__error" id="user-name-error" aria-live="polite"></span>
            </label>
            <label class="popup__label">
              <input
                type="text"
                name="user-description"
                id="user-description"
                class="popup__input popup__input_type_description"
                placeholder="Занятие"
                aria-describedby="user-description-error"
                required
                minlength="2"
                maxlength="200"
              />
              <span class="popup__error" id="user-description-error" aria-live="polite"></span>
            </label>
            <button
              type="submit"
              class="button popup__button popup__button_disabled"
              disabled
            >
              Сохранить
            </button>
          </form>
        </div>
      </div>

      <div class="popup popup_type_new-card">
        <div class="popup__content">
          <button type="button" class="popup__close"></button>
          <h3 class="popup__title">Новое место</h3>
          <form class="popup__form" name="new-place" novalidate>
            <label class="popup__label">
              <input
                type="text"
                name="place-name"
                id="place-name"
                class="popup__input popup__input_type_card-name"
                placeholder="Название"
                aria-describedby="place-name-error"
                required
                minlength="2"
                maxlength="30"
                pattern="^[a-zA-Zа-яА-ЯёЁ\s\-]+$"
                data-error-message="Разрешены только латинские и кириллические буквы, пробелы и дефисы."
              />
              <span class="popup__error" id="place-name-error" aria-live="polite"></span>
            </label>
            <label class="popup__label">
              <input
                type="url"
                name="place-link"
                id="place-link"
                class="popup__input popup__input_type_url"
                placeholder="Ссылка на картинку"
                aria-describedby="place-link-error"
                required
              />
              <span class="popup__error" id="place-link-error" aria-live="polite"></span>
            </label>
            <label class="popup__label">
              <input
                type="text"
                name="place-slug"
                id="place-slug"
                class="popup__input"
                placeholder="Слаг ссылки (altai-trip)"
                aria-label="Слаг ссылки"
                aria-describedby="place-slug-error"
                pattern="^[a-z0-9]+(-[a-z0-9]+)*$"
                data-error-message="Строчные буквы и дефисы (altai-trip)"
                required
              />
              <span class="popup__error" id="place-slug-error" aria-live="polite"></span>
            </label>
            <button
              type="submit"
              class="button popup__button popup__button_disabled"
              disabled
            >
              Создать
            </button>
          </form>
        </div>
      </div>

      <div class="popup popup_type_image">
        <div class="popup__content popup__content_content_image">
          <button type="button" class="popup__close"></button>
          <img alt="" class="popup__image" />
          <p class="popup__caption"></p>
        </div>
      </div>

      <div class="popup popup_type_edit-avatar">
        <div class="popup__content">
          <button type="button" class="popup__close"></button>
          <h3 class="popup__title">Обновить аватар</h3>
          <form class="popup__form" name="edit-avatar" novalidate>
            <label class="popup__label">
              <input
                type="url"
                name="user-avatar"
                id="user-avatar"
                class="popup__input popup__input_type_url"
                placeholder="Ссылка на изображение"
                aria-describedby="user-avatar-error"
                required
              />
              <span class="popup__error" id="user-avatar-error" aria-live="polite"></span>
            </label>
            <button
              type="submit"
              class="button popup__button popup__button_disabled"
              disabled
            >
              Сохранить
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="./src/scripts/index.js" type="module"></script>

    <template id="card-template">
      <li class="places__item card">
        <img class="card__image" alt="" />
        <div class="card__control">
          <button type="button" class="card__share-button" hidden>
            <span aria-live="polite">Поделиться</span>
          </button>
          <button type="button" class="card__control-button card__control-button_type_delete"></button>
        </div>
        <div class="card__description">
          <h2 class="card__title"></h2>
          <div class="card__likes">
            <button type="button" class="card__like-button"></button>
          </div>
        </div>
      </li>
    </template>
  </body>
</html>
